name: Build Turbapka APK

on:
  push:
    tags:
      - "turbapka-v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: turbapka
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.4'

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          value = os.environ.get('KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Configure ANDROID_KEYSTORE_BASE64 before releasing')
          Path(os.environ['RUNNER_TEMP'], 'release.jks').write_bytes(base64.b64decode(value, validate=True))
          PYTHON

      - run: flutter pub get --enforce-lockfile

      - run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify release signing identity
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          python3 - <<'PYTHON'
          import os, re, subprocess
          from pathlib import Path
          expected = os.environ.get('EXPECTED_CERT_SHA256', '').replace(':', '').lower()
          if not re.fullmatch('[0-9a-f]{64}', expected):
              raise SystemExit('Configure ANDROID_SIGNING_CERT_SHA256 before releasing')
          tools = list(Path(os.environ['ANDROID_HOME'], 'build-tools').glob('*/apksigner'))
          if not tools:
              raise SystemExit('apksigner unavailable')
          result = subprocess.run([str(sorted(tools)[-1]), 'verify', '--print-certs', 'build/app/outputs/flutter-apk/app-release.apk'], check=True, capture_output=True, text=True)
          digests = re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)', result.stdout)
          if [d.lower() for d in digests] != [expected]:
              raise SystemExit('APK signing identity does not match expected certificate')
          PYTHON

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turbapka-release-apk
          path: turbapka/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/turbapka-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: turbapka/build/app/outputs/flutter-apk/app-release.apk
