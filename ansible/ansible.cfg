[defaults]
inventory = inventory.yml
roles_path = roles
# dom.virgo and community.* from virgo's repository (~/git/dom/virgo): this
# playbook only uses its extension points (README there: "Integracja").
collections_path = ../../dom/virgo/ansible/collections
interpreter_python = /usr/local/bin/python3
result_format = yaml
retry_files_enabled = false
# Decrypts host_vars/*/*.sops.yml with sops (age key from SOPS_AGE_KEY_CMD,
# see mise.toml). mise run check turns it off: tests never decrypt secrets.
vars_plugins_enabled = host_group_vars,community.sops.sops

[privilege_escalation]
become = true
become_method = community.general.doas
become_ask_pass = true
