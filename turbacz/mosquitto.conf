# Turbacz MQTT broker.
#
# Home Assistant shares this broker with the ESP mesh, so anonymous access is
# off: anything on the LAN would otherwise be able to drive the relays.
#
# mosquitto.passwd is generated by setup.sh and is NOT in git. The broker will
# refuse to start without it, so run ./setup.sh before docker compose up.

listener 1883

allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd
acl_file /mosquitto/config/mosquitto.acl
