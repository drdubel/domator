[platformio]
default_envs = esp32c3-turbacz

[env]
framework = espidf
platform = espressif32@^6.0.0
; The platform's default CMake 3.16.4 is Intel-only on macOS.
platform_packages =
    platformio/tool-cmake@3.30.2
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
board_upload.maximum_size = 1441792
build_flags = 
    -DCONFIG_ARDUHAL_LOG_COLORS=1

[env:esp32-turbacz]
board = esp32dev

[env:esp32c3-turbacz]
board = esp32-c3-devkitm-1

[env:esp32-czupel]
board = esp32dev

[env:esp32c3-czupel]
board = esp32-c3-devkitm-1
